name: Update VLESS subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: vpn-main-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ${{ vars.VPN_RUNNER || 'ubuntu-latest' }}
    env:
      XRAY_VERSION: v26.7.28
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Decide whether recovery run is needed
        id: freshness
        env:
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os

          should_run = True
          if os.environ.get("EVENT_SCHEDULE") == "47 * * * *":
              try:
                  status = json.load(open("generation_status.json", encoding="utf-8"))
                  last = datetime.fromisoformat(status["last_success_at"])
                  age = (datetime.now(timezone.utc) - last).total_seconds()
                  should_run = age >= 45 * 60
              except (OSError, KeyError, TypeError, ValueError):
                  should_run = True
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={'true' if should_run else 'false'}\n")
          print("Run generator" if should_run else "Fresh primary result exists; recovery run skipped")
          PY

      - name: Test generator
        if: steps.freshness.outputs.run == 'true'
        run: |
          python3 -m py_compile update_vless.py validate_subscription.py test_update_vless.py
          python3 -m unittest -v

      - name: Restore geolocation cache
        if: steps.freshness.outputs.run == 'true'
        uses: actions/cache@v5
        with:
          path: .cache/geo.json
          key: geo-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            geo-${{ runner.os }}-

      - name: Cache Xray
        if: steps.freshness.outputs.run == 'true'
        id: cache-xray
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/xray
          key: xray-${{ runner.os }}-${{ env.XRAY_VERSION }}

      - name: Install verified Xray release
        if: steps.freshness.outputs.run == 'true' && steps.cache-xray.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/Xray-linux-64.zip"
          digest="$archive.dgst"
          release="https://github.com/XTLS/Xray-core/releases/download/$XRAY_VERSION"
          curl --fail --location --silent --show-error "$release/Xray-linux-64.zip" --output "$archive"
          curl --fail --location --silent --show-error "$release/Xray-linux-64.zip.dgst" --output "$digest"
          expected="$(awk -F'= ' '/SHA2-256/ {print $2}' "$digest")"
          echo "$expected  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/xray"
          unzip -q "$archive" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"

      - name: Configure Xray path
        if: steps.freshness.outputs.run == 'true'
        run: |
          echo "XRAY_BIN=$RUNNER_TEMP/xray/xray" >> "$GITHUB_ENV"

      - name: Generate subscription
        if: steps.freshness.outputs.run == 'true'
        id: generate
        env:
          VLESS_LIMIT: "20"
          VLESS_MIN_SERVERS: "3"
          STABILITY_MIN_STRICT_PASSES: "2"
          RU_PROBE_ASNS: "8359,12389"
          RU_PROBE_MIN_SUCCESS: "2"
          RU_PROBE_CACHE_TTL: "21600"
          RU_PROBE_WORKERS: "4"
          REALITY_TEST_LIMIT: "100"
          REALITY_TEST_WORKERS: "8"
          GEO_WORKERS: "8"
          ADVANCED_TEST_WORKERS: "6"
          FINALIST_LIMIT: "50"
          SOURCE_ROTATION_SECONDS: "3600"
        run: python3 update_vless.py

      - name: Validate generated Happ subscription
        if: steps.freshness.outputs.run == 'true'
        run: python3 validate_subscription.py

      - name: Publish health summary
        if: always() && steps.freshness.outputs.run == 'true'
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          import json
          import os

          try:
              status = json.load(open("generation_status.json", encoding="utf-8"))
          except (OSError, ValueError):
              status = {"status": "unknown", "message": "generation_status.json is unavailable"}
          if os.environ.get("GENERATE_OUTCOME") != "success":
              status["status"] = "failed"
              status["message"] = "Generator process failed before completing health checks"
          last_success = status.get("last_success_at")
          if last_success:
              try:
                  age = (datetime.now(timezone.utc) - datetime.fromisoformat(last_success)).total_seconds() / 3600
                  status["stale_hours"] = round(max(0, age), 2)
              except ValueError:
                  pass
          lines = [
              "## VPN subscription health",
              "",
              f"- Status: **{status.get('status', 'unknown')}**",
              f"- Selected: {status.get('selected_count', 'n/a')}",
              f"- Passed stability: {status.get('stability_passed_count', 'n/a')}",
              f"- Reachable from Russia: {status.get('russia_reachable_count', 'n/a')}",
              f"- Last success: {status.get('last_success_at', 'unknown')}",
              f"- Stale hours: {status.get('stale_hours', 'unknown')}",
              f"- Message: {status.get('message') or 'OK'}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write("\n".join(lines) + "\n")
          if status.get("status") != "healthy":
              print(f"::warning title=VPN subscription health::{status.get('message', 'status unknown')}")
          PY

      - name: Commit changes
        if: steps.freshness.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vless.txt vless_base64.txt server_history.json generation_status.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update VLESS subscription"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          echo "Failed to publish after 3 attempts" >&2
          exit 1
