name: Update VLESS subscription

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate generator
        run: python3 -m py_compile update_vless.py

      - name: Generate subscription
        env:
          VLESS_LIMIT: "10"
        run: python3 update_vless.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vless.txt vless_base64.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update VLESS subscription"
          git pull --rebase origin main
          git push origin main
